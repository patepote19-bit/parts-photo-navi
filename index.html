
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部品撮影ナビ</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:18px;background:#f3f5f7;color:#222}
h1{font-size:24px}
.card{background:white;padding:16px;border-radius:14px;margin:14px 0}
input,button{font-size:16px;box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px}
input{border:1px solid #bbb}
button{border:0;background:#075ee8;color:white;font-weight:bold}
button:disabled{background:#aaa}
img{width:100%;height:auto;border-radius:8px;margin-top:10px}
small{color:#666}
</style>
</head>
<body>
<h1>📸 部品撮影ナビ</h1>

<div class="card">
<label>部品管理番号</label>
<input id="partId" placeholder="例：P00123">
<label>部品名</label>
<input id="partName" placeholder="例：セルモーター">

<label>写真を撮る・選ぶ</label>
<input id="photo" type="file" accept="image/*" capture="environment">

<div id="previewArea" hidden>
<h3>撮影した写真</h3>
<img id="preview" alt="撮影した写真">
</div>
</div>

<div class="card">
<h3>写真チェック</h3>
<label><input type="checkbox"> 全体</label>
<label><input type="checkbox"> 品番・刻印</label>
<label><input type="checkbox"> 接続部分</label>
<label><input type="checkbox"> 傷・汚れ</label>
<label><input type="checkbox"> 裏側・別角度</label>
</div>

<div class="card">
<h3>番号入り写真を作る</h3>
<p><small>管理番号を写真の左上に合成するで。</small></p>
<button id="make" disabled>番号を写真に入れる</button>
<div id="resultArea" hidden>
<img id="result" alt="番号入り写真">
<button id="download">番号入り写真をダウンロード</button>
</div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const photo = document.getElementById('photo');
const preview = document.getElementById('preview');
const previewArea = document.getElementById('previewArea');
const make = document.getElementById('make');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let image = new Image();
let ready = false;
let outputUrl = '';

photo.addEventListener('change', () => {
  const file = photo.files && photo.files[0];
  if (!file) return;
  if (outputUrl) URL.revokeObjectURL(outputUrl);
  outputUrl = '';
  ready = false;
  document.getElementById('resultArea').hidden = true;
  const url = URL.createObjectURL(file);
  image = new Image();
  image.onload = () => {
    preview.src = url;
    previewArea.hidden = false;
    make.disabled = false;
    ready = true;
  };
  image.onerror = () => alert('写真を読み込めへんかった。別の写真で試してな。');
  image.src = url;
});

make.addEventListener('click', () => {
  if (!ready) return;
  const id = document.getElementById('partId').value.trim();
  if (!id) {
    alert('先に部品管理番号を入力してな。');
    document.getElementById('partId').focus();
    return;
  }

  const w = image.naturalWidth;
  const h = image.naturalHeight;
  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(image, 0, 0, w, h);

  const scale = Math.max(1, w / 900);
  const pad = 18 * scale;
  const fontSize = Math.max(24, Math.round(w * 0.045));
  ctx.font = `bold ${fontSize}px sans-serif`;
  const label = id;
  const boxW = ctx.measureText(label).width + pad * 2;
  const boxH = fontSize + pad * 1.4;

  ctx.fillStyle = '#087cf0';
  ctx.fillRect(0, 0, boxW, boxH);
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, pad, boxH / 2);

  canvas.toBlob(blob => {
    if (!blob) {
      alert('写真の作成に失敗したで。もう一度試してな。');
      return;
    }
    if (outputUrl) URL.revokeObjectURL(outputUrl);
    outputUrl = URL.createObjectURL(blob);
    document.getElementById('result').src = outputUrl;
    document.getElementById('resultArea').hidden = false;
  }, 'image/jpeg', 0.92);
});

document.getElementById('download').addEventListener('click', () => {
  if (!outputUrl) return;
  const id = document.getElementById('partId').value.trim()
    .replace(/[^a-zA-Z0-9_-]/g, '_') || 'part';
  const a = document.createElement('a');
  a.href = outputUrl;
  a.download = id + '.jpg';
  document.body.appendChild(a);
  a.click();
  a.remove();
});
</script>
</body>
</html>
