<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部品撮影ナビ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:18px;background:#f3f5f7;color:#222}
h1{font-size:24px}.card{background:white;padding:16px;border-radius:14px;margin:14px 0;box-shadow:0 1px 4px #0000000d}
input,button{font-size:16px;box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px}
input{border:1px solid #bbb}button{border:0;background:#075ee8;color:white;font-weight:bold;cursor:pointer}
button:disabled{background:#aaa}button.secondary{background:#586579}
img{width:100%;height:auto;border-radius:8px;margin-top:10px}
small,.muted{color:#666}.status{padding:10px;border-radius:8px;background:#eef3fa;white-space:pre-wrap}
.part{padding:10px 0;border-bottom:1px solid #eee}.part:last-child{border:0}
label{display:block;margin:9px 0} .checks label{display:inline-block;margin-right:12px}
</style>
</head>
<body>
<h1>📸 部品撮影ナビ</h1>

<div class="card" id="authCard">
  <h3>ログイン</h3>
  <p class="muted">Supabaseに登録済みのメールアドレスとパスワードを入力してな。</p>
  <label>メールアドレス</label>
  <input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
  <label>パスワード</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
  <button id="loginButton">ログイン</button>
  <div id="authMessage" class="status" role="status">ログインすると部品データを保存・表示できるで。</div>
</div>

<div id="appArea" hidden>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <strong>ログイン中</strong><button id="logoutButton" class="secondary" style="width:auto">ログアウト</button>
    </div>
    <div id="userLabel" class="muted"></div>
  </div>

  <div class="card">
    <h3>部品情報</h3>
    <label>部品管理番号</label>
    <input id="partId" placeholder="例：P00123">
    <label>部品名</label>
    <input id="partName" placeholder="例：セルモーター">
    <label>写真を撮る・選ぶ</label>
    <input id="photo" type="file" accept="image/*" capture="environment">
    <div id="previewArea" hidden>
      <h3>撮影した写真</h3>
      <img id="preview" alt="撮影した写真">
    </div>
  </div>

  <div class="card checks">
    <h3>写真チェック</h3>
    <label><input type="checkbox" class="photoCheck" value="全体"> 全体</label>
    <label><input type="checkbox" class="photoCheck" value="品番・刻印"> 品番・刻印</label>
    <label><input type="checkbox" class="photoCheck" value="接続部分"> 接続部分</label>
    <label><input type="checkbox" class="photoCheck" value="傷・汚れ"> 傷・汚れ</label>
    <label><input type="checkbox" class="photoCheck" value="裏側・別角度"> 裏側・別角度</label>
  </div>

  <div class="card">
    <h3>番号入り写真を作る</h3>
    <p><small>管理番号を写真の左上に合成するで。</small></p>
    <button id="make" disabled>番号を写真に入れる</button>
    <div id="resultArea" hidden>
      <img id="result" alt="番号入り写真">
      <button id="download">番号入り写真をダウンロード</button>
    </div>
  </div>

  <div class="card">
    <h3>部品データを保存</h3>
    <p class="muted">今回は部品番号・部品名・状態をSupabaseに保存するで。写真ファイルのクラウド保存は次の段階で追加する。</p>
    <button id="savePart">部品データを保存</button>
    <div id="saveMessage" class="status" role="status">保存待ち</div>
  </div>

  <div class="card">
    <h3>登録済み部品</h3>
    <button id="reloadParts" class="secondary">一覧を更新</button>
    <div id="partsList" class="muted">読み込み待ち</div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const SUPABASE_URL = 'https://smvzvonjjencnjhijapl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qkAR8gHzumahoX_10QI1Yg_8DOa1wrS';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let image = new Image();
let ready = false;
let outputUrl = '';
let sourceUrl = '';

function showAuthMessage(message){ $('authMessage').textContent = message; }
function showSaveMessage(message){ $('saveMessage').textContent = message; }

async function updateSession(){
  const { data, error } = await db.auth.getSession();
  if(error){ showAuthMessage('ログイン状態を確認できへんかった：' + error.message); return; }
  const session = data.session;
  $('authCard').hidden = !!session;
  $('appArea').hidden = !session;
  if(session){
    $('userLabel').textContent = session.user.email || '';
    await loadParts();
  }
}

$('loginButton').addEventListener('click', async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if(!email || !password){ showAuthMessage('メールアドレスとパスワードを入力してな。'); return; }
  $('loginButton').disabled = true;
  showAuthMessage('ログイン中…');
  const { error } = await db.auth.signInWithPassword({ email, password });
  $('loginButton').disabled = false;
  if(error){ showAuthMessage('ログインできませんでした：' + error.message); return; }
  showAuthMessage('ログインしました。');
  await updateSession();
});

$('logoutButton').addEventListener('click', async () => {
  const { error } = await db.auth.signOut();
  if(error){ alert('ログアウトできませんでした：' + error.message); return; }
  await updateSession();
});

db.auth.onAuthStateChange((_event, session) => {
  $('authCard').hidden = !!session;
  $('appArea').hidden = !session;
  if(session){ $('userLabel').textContent = session.user.email || ''; }
});

$('photo').addEventListener('change', () => {
  const file = $('photo').files && $('photo').files[0];
  if(!file) return;
  if(outputUrl) URL.revokeObjectURL(outputUrl);
  if(sourceUrl) URL.revokeObjectURL(sourceUrl);
  outputUrl = '';
  ready = false;
  $('resultArea').hidden = true;
  sourceUrl = URL.createObjectURL(file);
  image = new Image();
  image.onload = () => {
    $('preview').src = sourceUrl;
    $('previewArea').hidden = false;
    $('make').disabled = false;
    ready = true;
  };
  image.onerror = () => alert('写真を読み込めへんかった。別の写真で試してな。');
  image.src = sourceUrl;
});

$('make').addEventListener('click', () => {
  if(!ready) return;
  const id = $('partId').value.trim();
  if(!id){ alert('先に部品管理番号を入力してな。'); $('partId').focus(); return; }
  const w = image.naturalWidth, h = image.naturalHeight;
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  canvas.width = w; canvas.height = h;
  ctx.drawImage(image, 0, 0, w, h);
  const scale = Math.max(1, w / 900);
  const pad = 18 * scale;
  const fontSize = Math.max(24, Math.round(w * 0.045));
  ctx.font = `bold ${fontSize}px sans-serif`;
  const boxW = ctx.measureText(id).width + pad * 2;
  const boxH = fontSize + pad * 1.4;
  ctx.fillStyle = '#087cf0'; ctx.fillRect(0, 0, boxW, boxH);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  ctx.fillText(id, pad, boxH / 2);
  canvas.toBlob(blob => {
    if(!blob){ alert('写真の作成に失敗したで。もう一度試してな。'); return; }
    if(outputUrl) URL.revokeObjectURL(outputUrl);
    outputUrl = URL.createObjectURL(blob);
    $('result').src = outputUrl;
    $('resultArea').hidden = false;
  }, 'image/jpeg', 0.92);
});

$('download').addEventListener('click', () => {
  if(!outputUrl) return;
  const id = $('partId').value.trim().replace(/[^a-zA-Z0-9_-]/g, '_') || 'part';
  const a = document.createElement('a');
  a.href = outputUrl; a.download = id + '.jpg';
  document.body.appendChild(a); a.click(); a.remove();
});

$('savePart').addEventListener('click', async () => {
  const part_id = $('partId').value.trim();
  const part_name = $('partName').value.trim();
  if(!part_id){ showSaveMessage('部品管理番号を入力してな。'); $('partId').focus(); return; }
  const { data: sessionData } = await db.auth.getSession();
  if(!sessionData.session){ showSaveMessage('ログインし直してな。'); return; }
  $('savePart').disabled = true;
  showSaveMessage('保存中…');
  const checks = [...document.querySelectorAll('.photoCheck:checked')].map(el => el.value);
  const status = checks.length ? checks.join('・') : '未確認';
  const { error } = await db.from('parts').insert({
    part_id,
    part_name: part_name || null,
    status
  });
  $('savePart').disabled = false;
  if(error){
    showSaveMessage('保存できませんでした：' + error.message + '\n入力内容やテーブル設定を確認する必要があるで。');
    return;
  }
  showSaveMessage('保存できたで！');
  await loadParts();
});

async function loadParts(){
  $('partsList').textContent = '読み込み中…';
  const { data, error } = await db.from('parts')
    .select('part_id, part_name, status')
    .order('part_id', { ascending: true });
  if(error){ $('partsList').textContent = '読み込めませんでした：' + error.message; return; }
  if(!data || data.length === 0){ $('partsList').textContent = 'まだ部品データは登録されていません。'; return; }
  $('partsList').innerHTML = '';
  data.forEach(part => {
    const item = document.createElement('div');
    item.className = 'part';
    const title = document.createElement('strong');
    title.textContent = part.part_id || '';
    const detail = document.createElement('div');
    detail.textContent = (part.part_name || '部品名未入力') + ' ／ ' + (part.status || '状態未設定');
    item.append(title, detail);
    $('partsList').appendChild(item);
  });
}
$('reloadParts').addEventListener('click', loadParts);

updateSession();
</script>
</body>
</html>
