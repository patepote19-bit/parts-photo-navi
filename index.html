<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部品撮影ナビ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:18px;background:#f3f5f7;color:#222}
h1{font-size:24px}.card{background:white;padding:16px;border-radius:14px;margin:14px 0;box-shadow:0 1px 4px #0000000d}
input,button{font-size:16px;box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px}
input{border:1px solid #bbb}button{border:0;background:#075ee8;color:white;font-weight:bold;cursor:pointer}
button:disabled{background:#aaa}button.secondary{background:#586579}
img{width:100%;height:auto;border-radius:8px;margin-top:10px}
figure{margin:12px 0}figcaption{font-size:14px;color:#666;overflow-wrap:anywhere}
small,.muted{color:#666}.status{padding:10px;border-radius:8px;background:#eef3fa;white-space:pre-wrap}
.part{padding:10px 0;border-bottom:1px solid #eee}.part:last-child{border:0}
label{display:block;margin:9px 0} .checks label{display:inline-block;margin-right:12px}
</style>
</head>
<body>
<h1>📸 部品撮影ナビ</h1>

<div class="card" id="authCard">
<h3>ログイン</h3>
<p class="muted">Supabaseに登録済みのメールアドレスとパスワードを入力してな。</p>
<label>メールアドレス</label>
<input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
<label>パスワード</label>
<input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
<button id="loginButton">ログイン</button>
<div id="authMessage" class="status">ログインすると部品データを保存・表示できるで。</div>
</div>

<div id="appArea" hidden>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<strong>ログイン中</strong><button id="logoutButton" class="secondary" style="width:auto">ログアウト</button>
</div>
<div id="userLabel" class="muted"></div>
</div>

<div class="card">
<h3>部品情報</h3>
<label>部品管理番号</label>
<input id="partId" placeholder="例：P00123">
<label>部品名</label>
<input id="partName" placeholder="例：セルモーター">
<label>写真を撮る・選ぶ</label>
<input id="photo" type="file" accept="image/*" capture="environment">
<div id="previewArea" hidden>
<h3>撮影した写真（自動圧縮）</h3>
<img id="preview" alt="撮影した写真">
<div id="compressionInfo" class="muted"></div>
</div>
</div>

<div class="card checks">
<h3>写真チェック</h3>
<label><input type="checkbox" class="photoCheck" value="全体"> 全体</label>
<label><input type="checkbox" class="photoCheck" value="品番・刻印"> 品番・刻印</label>
<label><input type="checkbox" class="photoCheck" value="接続部分"> 接続部分</label>
<label><input type="checkbox" class="photoCheck" value="傷・汚れ"> 傷・汚れ</label>
<label><input type="checkbox" class="photoCheck" value="裏側・別角度"> 裏側・別角度</label>
</div>

<div class="card">
<h3>番号入り写真を作る</h3>
<p><small>管理番号を写真の左上に合成するで。</small></p>
<button id="make" disabled>番号を写真に入れる</button>
<div id="resultArea" hidden>
<img id="result" alt="番号入り写真">
<button id="download">番号入り写真をダウンロード</button>
</div>
</div>

<div class="card">
<h3>部品データ・写真を保存</h3>
<p class="muted">部品情報はpartsテーブルへ、写真は非公開のparts-photosへ保存するで。写真は長辺2048px以内・JPEG画質85%を目安に自動圧縮する。</p>
<button id="savePart">部品データを保存</button>
<button id="uploadPhoto" class="secondary" disabled>写真をクラウドへ保存</button>
<div id="saveMessage" class="status">保存待ち</div>
</div>

<div class="card">
<h3>登録済み部品</h3>
<button id="reloadParts" class="secondary">一覧を更新</button>
<div id="partsList" class="muted">読み込み待ち</div>
</div>
</div>

<canvas id="canvas" hidden></canvas>
<script>
const SUPABASE_URL = "https://smvzvonjjencnjhijapl.supabase.co";
const SUPABASE_KEY = "sb_publishable_qkAR8gHzumahoX_10QI1Yg_8DOa1wrS";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let compressedBlob = null;
let numberedBlob = null;
let previewUrl = null;
let resultUrl = null;
const galleryUrls = new Set();

const $ = id => document.getElementById(id);

function message(id, text) {
  $(id).textContent = text;
}

function showApp(user) {
  currentUser = user;
  $("authCard").hidden = true;
  $("appArea").hidden = false;
  $("userLabel").textContent = user.email || user.id;
  loadParts();
}

async function checkLogin() {
  const { data, error } = await db.auth.getSession();
  if (error) {
    message("authMessage", error.message);
    return;
  }
  if (data.session) showApp(data.session.user);
}

$("loginButton").onclick = async () => {
  const email = $("email").value.trim().replaceAll("＠", "@");
  $("email").value = email;
  const password = $("password").value;

  if (!email || !password) {
    message("authMessage", "メールアドレスとパスワードを入力してな。");
    return;
  }

  $("loginButton").disabled = true;
  message("authMessage", "ログイン中...");

  const { data, error } = await db.auth.signInWithPassword({
    email, password
  });

  $("loginButton").disabled = false;

  if (error) {
    const authErrorMessage = /invalid login credentials/i.test(error.message)
      ? "メールアドレスかパスワードが違うみたいやで。登録済みのメールアドレスとパスワードを確認してな。"
      : "ログインできませんでした。入力内容と通信状態を確認して、もう一度試してな。";
    message("authMessage", authErrorMessage);
    return;
  }

  showApp(data.user);
};

$("logoutButton").onclick = async () => {
  await db.auth.signOut();
  currentUser = null;
  $("appArea").hidden = true;
  $("authCard").hidden = false;
  $("partsList").replaceChildren();
  revokeGalleryUrls();
  message("authMessage", "ログアウトしました。");
};

function resetPhotoResult() {
  compressedBlob = null;
  numberedBlob = null;
  $("previewArea").hidden = true;
  $("resultArea").hidden = true;
  $("make").disabled = true;
  $("uploadPhoto").disabled = true;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  if (resultUrl) URL.revokeObjectURL(resultUrl);
  previewUrl = null;
  resultUrl = null;
}

$("photo").onchange = async event => {
  resetPhotoResult();

  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    message("saveMessage", "画像ファイルを選んでな。");
    return;
  }

  message("saveMessage", "写真を圧縮中...");

  try {
    const bitmap = await createImageBitmap(file);
    const maxEdge = 2048;
    const scale = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height));
    const width = Math.round(bitmap.width * scale);
    const height = Math.round(bitmap.height * scale);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, width, height);
    bitmap.close();

    compressedBlob = await new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error("JPEG圧縮に失敗しました"));
      }, "image/jpeg", 0.85);
    });

    previewUrl = URL.createObjectURL(compressedBlob);
    $("preview").src = previewUrl;
    $("previewArea").hidden = false;
    $("compressionInfo").textContent =
      `${width}×${height}px ／ ${(file.size / 1024).toFixed(0)}KB → ${(compressedBlob.size / 1024).toFixed(0)}KB`;

    $("make").disabled = false;
    $("uploadPhoto").disabled = false;
    message("saveMessage", "圧縮完了。部品番号を確認してな。");
  } catch (error) {
    message("saveMessage", "写真処理エラー：" + error.message);
  }
};

$("make").onclick = async () => {
  if (!compressedBlob) return;

  const partId = $("partId").value.trim();
  if (!partId) {
    message("saveMessage", "先に部品管理番号を入力してな。");
    return;
  }

  const img = new Image();
  const sourceUrl = URL.createObjectURL(compressedBlob);
  img.src = sourceUrl;

  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
  }).finally(() => URL.revokeObjectURL(sourceUrl));

  const canvas = $("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);

  const fontSize = Math.max(24, Math.round(canvas.width * 0.035));
  const padding = Math.round(fontSize * 0.5);

  ctx.font = `bold ${fontSize}px sans-serif`;
  const textWidth = ctx.measureText(partId).width;

  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fillRect(0, 0, textWidth + padding * 2, fontSize + padding * 2);

  ctx.fillStyle = "#fff";
  ctx.textBaseline = "top";
  ctx.fillText(partId, padding, padding);

  numberedBlob = await new Promise((resolve, reject) =>
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("番号入り写真を作れませんでした")), "image/jpeg", 0.9)
  );

  if (resultUrl) URL.revokeObjectURL(resultUrl);
  resultUrl = URL.createObjectURL(numberedBlob);
  $("result").src = resultUrl;
  $("resultArea").hidden = false;
};

$("download").onclick = () => {
  if (!numberedBlob) return;

  const partId = $("partId").value.trim() || "part";
  const url = URL.createObjectURL(numberedBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = partId + "_番号入り.jpg";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

$("savePart").onclick = async () => {
  if (!currentUser) return;

  const partId = $("partId").value.trim();
  const partName = $("partName").value.trim();

  if (!partId) {
    message("saveMessage", "部品管理番号を入力してな。");
    return;
  }

  message("saveMessage", "部品データを保存中...");

  const { data: existing, error: lookupError } = await db.from("parts")
    .select("part_id")
    .eq("part_id", partId)
    .maybeSingle();

  if (lookupError) {
    message("saveMessage", "既存データを確認できませんでした。保存は行っていません：" + lookupError.message);
    return;
  }

  const saveResult = existing
    ? (partName
        ? await db.from("parts").update({ part_name: partName }).eq("part_id", partId)
        : { error: null })
    : await db.from("parts").insert({
        part_id: partId,
        part_name: partName || null,
        status: "未撮影"
      });

  const { error } = saveResult;

  if (error) {
    message("saveMessage", "保存エラー：" + error.message);
    return;
  }

  message("saveMessage", existing
    ? (partName ? "部品名を更新したで。撮影状態はそのままやで。" : "この部品番号は登録済みやで。既存データは変更してへん。")
    : "部品データを保存したで。");
  loadParts();
};

$("uploadPhoto").onclick = async () => {
  if (!currentUser || !compressedBlob) return;

  const partId = $("partId").value.trim();

  if (!partId) {
    message("saveMessage", "部品管理番号を入力してな。");
    return;
  }

  const category = Array.from(
    document.querySelectorAll(".photoCheck:checked")
  ).map(el => el.value);

  const categoryLabel = category.length ? category.join("_") : "未分類";
  const filename = `${Date.now()}_${categoryLabel}.jpg`;
  const path = `${currentUser.id}/${partId}/${filename}`;

  message("saveMessage", "写真をクラウドへアップロード中...");

  $("uploadPhoto").disabled = true;

  const photoBlob = numberedBlob || compressedBlob;
  const { error } = await db.storage
    .from("parts-photos")
    .upload(path, photoBlob, {
      contentType: "image/jpeg",
      upsert: false
    });

  $("uploadPhoto").disabled = false;

  if (error) {
    message("saveMessage", "写真保存エラー：" + error.message);
    return;
  }

  message("saveMessage", `写真を非公開で保存したで！\n種類：${categoryLabel}\n${numberedBlob ? "管理番号入り" : "管理番号なし"}`);
  loadParts();
};

async function loadParts() {
  if (!currentUser) return;

  revokeGalleryUrls();
  message("partsList", "読み込み中...");

  const { data, error } = await db.from("parts")
    .select("part_id, part_name, status")
    .order("created_at", { ascending: false });

  if (error) {
    message("partsList", "一覧取得エラー：" + error.message);
    return;
  }

  $("partsList").replaceChildren();

  if (!data || data.length === 0) {
    message("partsList", "登録済み部品はまだないで。");
    return;
  }

  data.forEach(part => {
    const div = document.createElement("div");
    div.className = "part";

    const strong = document.createElement("strong");
    strong.textContent = part.part_id;

    const detail = document.createElement("div");
    detail.textContent =
      `${part.part_name || "名称未入力"} ／ ${part.status || "状態未設定"}`;

    const photoButton = document.createElement("button");
    photoButton.type = "button";
    photoButton.className = "secondary";
    photoButton.textContent = "自分が保存した写真を見る";
    const photoArea = document.createElement("div");
    photoArea.hidden = true;
    let partPhotoUrls = [];
    photoButton.onclick = async () => {
      partPhotoUrls.forEach(url => {
        URL.revokeObjectURL(url);
        galleryUrls.delete(url);
      });
      partPhotoUrls = [];
      photoArea.hidden = false;
      photoArea.replaceChildren();
      photoArea.textContent = "写真を読み込み中...";
      const folder = `${currentUser.id}/${part.part_id}`;
      const { data: files, error: listError } = await db.storage
        .from("parts-photos")
        .list(folder, { limit: 100, sortBy: { column: "name", order: "desc" } });

      if (listError) {
        photoArea.textContent = "写真を読み込めませんでした：" + listError.message;
        return;
      }

      const photos = (files || []).filter(file => file.id !== null && file.name && !file.name.startsWith("."));
      if (!photos.length) {
        photoArea.textContent = "この部品の写真はまだないで。";
        return;
      }

      photoArea.replaceChildren();
      for (const file of photos) {
        const filePath = `${folder}/${file.name}`;
        const { data: photoBlob, error: downloadError } = await db.storage
          .from("parts-photos")
          .download(filePath);
        if (downloadError || !photoBlob) continue;

        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.loading = "lazy";
        const photoUrl = URL.createObjectURL(photoBlob);
        partPhotoUrls.push(photoUrl);
        galleryUrls.add(photoUrl);
        image.src = photoUrl;
        image.alt = `${part.part_id} の写真 ${file.name}`;
        const caption = document.createElement("figcaption");
        caption.textContent = file.name.replace(/^\d+_/, "").replace(/\.jpg$/i, "");
        figure.append(image, caption);
        photoArea.appendChild(figure);
      }

      if (!photoArea.childElementCount) {
        photoArea.textContent = "写真リンクを作れませんでした。ログイン状態と閲覧権限を確認してな。";
      }
    };

    div.append(strong, detail, photoButton, photoArea);
    $("partsList").appendChild(div);
  });
}

function revokeGalleryUrls() {
  galleryUrls.forEach(url => URL.revokeObjectURL(url));
  galleryUrls.clear();
}

$("reloadParts").onclick = loadParts;

checkLogin();
</script>
</body>
</html>
